<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drexora AI</title>
    <meta name="description" content="Drexora AI — a focused, private-feeling AI chat workspace.">
    <meta name="theme-color" content="#212121">
    <link rel="icon" type="image/png" href="assets/drexora-mark.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="sidebar-top">
          <a class="brand" href="index.html" aria-label="Drexora AI home">
            <span class="brand-mark"><img src="assets/drexora-mark.png" alt=""></span>
            <span>Drexora AI</span>
          </a>
          <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close sidebar">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <button class="new-chat" id="new-chat" type="button">
          <span class="new-chat-icon" aria-hidden="true">＋</span>
          <span>New chat</span>
          <span class="shortcut">⌘ K</span>
        </button>

        <div class="history" id="history">
          <p class="history-label">Today</p>
          <button class="history-item selected" type="button" data-chat="Welcome to Drexora AI">
            <span class="history-icon" aria-hidden="true">◌</span>
            <span>Welcome to Drexora AI</span>
          </button>
          <button class="history-item" type="button" data-chat="Ideas for a better morning">
            <span class="history-icon" aria-hidden="true">◌</span>
            <span>Ideas for a better morning</span>
          </button>
          <p class="history-label older">Previous 7 days</p>
          <button class="history-item" type="button" data-chat="Plan my next project">
            <span class="history-icon" aria-hidden="true">◌</span>
            <span>Plan my next project</span>
          </button>
          <button class="history-item" type="button" data-chat="Explain quantum computing">
            <span class="history-icon" aria-hidden="true">◌</span>
            <span>Explain quantum computing</span>
          </button>
        </div>

        <div class="sidebar-bottom">
          <a class="sidebar-link" href="#" id="clear-history"><span class="sidebar-link-icon" aria-hidden="true">⌫</span> Clear conversations</a>
          <a class="sidebar-link" href="mailto:drexxora@yahoo.com"><span class="sidebar-link-icon" aria-hidden="true">?</span> Help &amp; feedback</a>
          <div class="user-card">
            <span class="avatar">D</span>
            <span class="user-copy"><strong>Drexora user</strong><small>Personal workspace</small></span>
            <button class="icon-button more-button" type="button" aria-label="More account options">•••</button>
          </div>
        </div>
      </aside>

      <div class="sidebar-scrim" id="sidebar-scrim"></div>

      <main class="chat-area">
        <header class="chat-header">
          <button class="icon-button menu-button" id="sidebar-open" type="button" aria-label="Open sidebar">
            <span aria-hidden="true">☰</span>
          </button>
          <button class="model-picker" type="button" aria-label="Choose model">
            <span>Drexora AI</span>
            <span class="model-badge">Standard</span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="header-actions">
            <button class="icon-button" type="button" id="share-chat" aria-label="Share chat"><span aria-hidden="true">↗</span></button>
            <button class="icon-button" type="button" id="toggle-theme" aria-label="Toggle theme"><span aria-hidden="true">☼</span></button>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="welcome-state" id="welcome-state">
            <div class="welcome-mark"><img src="assets/drexora-mark.png" alt=""></div>
            <h1>How can I help you today?</h1>
            <p>Ask Drexora AI to think, write, plan, or explore with you.</p>
            <div class="prompt-grid">
              <button class="prompt-card" type="button" data-prompt="Help me plan a focused and productive day"><span class="prompt-icon purple" aria-hidden="true">◷</span><span><strong>Plan my day</strong><small>Create a focused routine</small></span><span class="prompt-arrow" aria-hidden="true">↗</span></button>
              <button class="prompt-card" type="button" data-prompt="Give me five creative ideas for a side project"><span class="prompt-icon lime" aria-hidden="true">✦</span><span><strong>Explore ideas</strong><small>Find a fresh direction</small></span><span class="prompt-arrow" aria-hidden="true">↗</span></button>
              <button class="prompt-card" type="button" data-prompt="Explain a complex topic in a simple way"><span class="prompt-icon blue" aria-hidden="true">◇</span><span><strong>Learn something</strong><small>Make it easy to understand</small></span><span class="prompt-arrow" aria-hidden="true">↗</span></button>
              <button class="prompt-card" type="button" data-prompt="Help me write a clear and thoughtful message"><span class="prompt-icon orange" aria-hidden="true">✎</span><span><strong>Write with me</strong><small>Turn thoughts into words</small></span><span class="prompt-arrow" aria-hidden="true">↗</span></button>
            </div>
          </div>
        </section>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <textarea id="prompt-input" rows="1" placeholder="Message Drexora AI" aria-label="Message Drexora AI"></textarea>
            <div class="composer-toolbar">
              <div class="composer-tools">
                <button class="composer-tool" type="button" id="attach-file" aria-label="Attach a file"><span aria-hidden="true">＋</span><span>Attach</span></button>
                <button class="composer-tool" type="button" id="deep-think" aria-label="Toggle deep thinking"><span aria-hidden="true">✧</span><span>Think</span></button>
              </div>
              <div class="composer-actions">
                <span class="char-count" id="char-count">0 / 4000</span>
                <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled><span aria-hidden="true">↑</span></button>
              </div>
            </div>
          </form>
          <p class="composer-note">Drexora AI can make mistakes. Check important information.</p>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
