services:
  - type: web
    name: drexora-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_URL
        value: https://api.openrouter.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_PROVIDER
        value: auto
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://beastai-f0702-default-rtdb.firebaseio.com
      - key: FRONTEND_URL
        value: https://drexora-ai.onrender.com,https://daviddchucks-hash.github.io
      - key: DEFAULT_AI_MODEL
        value: gpt-4o-mini
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: '60'
      - key: NODE_ENV
        value: production