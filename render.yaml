services:
  - type: web
    name: drexora-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_URL
        value: https://api.openrouter.ai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_FREE_MODELS
        value: gemini-2.0-flash,gemini-2.0-flash-lite,gemini-1.5-flash,gemini-1.5-flash-8b
      - key: AI_PROVIDER
        value: auto
      - key: OPENROUTER_FREE_MODELS
        value: meta-llama/llama-3.3-70b-instruct:free,google/gemini-2.0-flash-exp:free,deepseek/deepseek-r1:free,nvidia/nemotron-nano-8b-v2:free,microsoft/phi-3-mini-128k-instruct:free
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://beastai-f0702-default-rtdb.firebaseio.com
      - key: FRONTEND_URL
        value: https://daviddchucks-hash.github.io,https://drexora-ai.onrender.com
      - key: DEFAULT_AI_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: '60'
      - key: PUBLIC_CHAT
        value: 'true'
      - key: SHOW_PROVIDER_ERRORS
        value: 'true'
      - key: NODE_ENV
        value: production
