kind = "web"
previewPath = "/"
title = "Drexora Guard"
description = "A polished Windows security software website for Drexora Guard, with product overview, features, requirements, and a clear installer download experience."
version = "1.0.0"
id = "artifacts/drexora-guard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22528

[services.development]
run = "pnpm --filter @workspace/drexora-guard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drexora-guard", "run", "build" ]
serve = "static"
publicDir = "artifacts/drexora-guard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22528"
BASE_PATH = "/"
